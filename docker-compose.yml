services:
  db:
    image: pgvector/pgvector:pg16
    container_name: jobtracker-db-compose
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
      POSTGRES_DB: jobtracker
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d jobtracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: jobtracker-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://appuser:apppassword@db:5432/jobtracker
      SECRET_KEY: development-secret-key-change-me
      GROQ_API_KEY: ${GROQ_API_KEY}
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data: